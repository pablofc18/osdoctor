name: CI

on:
  push:
    branches: [ main, rust-port ]
  pull_request:

# Least privilege: this workflow only reads the repo to build and test.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Smoke test
        run: |
          ./target/release/osdoctor version
          ./target/release/osdoctor help
          # `scan` may exit non-zero on the runner (e.g. no Wayland session);
          # we only assert that it runs and that --json stays valid.
          ./target/release/osdoctor scan || true
          ./target/release/osdoctor scan --json | python3 -m json.tool > /dev/null
